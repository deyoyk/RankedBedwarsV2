name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (default: v<pom version>)'
        required: false
        default: ''
      create_release:
        description: 'Create GitHub release'
        required: false
        default: true
        type: boolean

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-bot:
    name: Build bot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Install dependencies
        working-directory: bot
        run: npm ci

      - name: Typecheck
        working-directory: bot
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: bot
        run: npm test

      - name: Lint
        working-directory: bot
        run: npm run lint

      - name: Build
        working-directory: bot
        run: npm run build

      - name: Package bot
        run: |
          cd bot
          zip -r ../rbw-bot.zip . -x 'node_modules/*' '.env' '*.log'

      - name: Upload bot artifact
        uses: actions/upload-artifact@v4
        with:
          name: rbw-bot
          path: rbw-bot.zip
          retention-days: 30

  build-website:
    name: Build website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit

      - name: Build static export
        working-directory: web
        run: npm run build

      - name: Package website
        run: |
          cd web
          zip -r ../rbw-website.zip . -x 'node_modules/*' '.env*' '*.log'

      - name: Upload website artifact
        uses: actions/upload-artifact@v4
        with:
          name: rbw-website
          path: rbw-website.zip
          retention-days: 30

  build-plugin:
    name: Build plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Build and test with Maven
        working-directory: plugin
        run: mvn clean package

      - name: Rename plugin jar
        run: |
          JAR=$(ls plugin/target/RankedBedwars-*.jar | grep -v 'original-' | head -n 1)
          cp "$JAR" rbw-plugin.jar

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: rbw-plugin
          path: rbw-plugin.jar
          retention-days: 30

  release:
    name: Publish release
    needs: [build-bot, build-website, build-plugin]
    if: inputs.create_release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Get version from pom.xml
        id: version
        working-directory: plugin
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Built version: $VERSION"

      - name: Get tag name
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="v${{ steps.version.outputs.version }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG"

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: '{rbw-bot,rbw-website,rbw-plugin}'
          path: release-assets

      - name: Delete previous release with same tag
        run: gh release delete "${{ steps.tag.outputs.tag }}" --yes --cleanup-tag || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release-assets/rbw-plugin/rbw-plugin.jar
            release-assets/rbw-bot/rbw-bot.zip
            release-assets/rbw-website/rbw-website.zip
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          body: |
            ## RankedBedwars ${{ steps.version.outputs.version }}

            ### Changes
            - See commit history for details

            ### Installation
            1. Plugin: download `rbw-plugin.jar` from the assets below, place it in your server's `plugins` folder, restart your server
            2. Bot: download `rbw-bot.zip`, extract, run `npm ci`, copy `.env.example` to `.env` and fill it in, then `npm start`
            3. Web: download `rbw-website.zip`, extract, run `npm ci && npm run build`
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
