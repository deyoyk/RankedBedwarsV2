name: Build and Release

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub release'
        required: false
        default: true
        type: boolean

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build-bot:
    name: Build bot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Install dependencies
        working-directory: bot
        run: npm ci

      - name: Typecheck
        working-directory: bot
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: bot
        run: npm test

      - name: Lint
        working-directory: bot
        run: npm run lint

      - name: Build
        working-directory: bot
        run: npm run build

      - name: Package bot
        run: |
          cd bot
          zip -r ../rbw-bot.zip . -x 'node_modules/*' '.env' '*.log'

      - name: Upload bot artifact
        uses: actions/upload-artifact@v4
        with:
          name: rbw-bot
          path: rbw-bot.zip
          retention-days: 30

  release:
    name: Publish release
    needs: [build-bot]
    if: inputs.create_release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Calculate next sequential release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=0
          while IFS= read -r TAG; do
            if [[ "$TAG" =~ ^v([0-9]+)$ ]]; then
              NUM=${BASH_REMATCH[1]}
              if (( NUM > LATEST )); then
                LATEST=$NUM
              fi
            fi
          done < <(
            gh release list --limit 1000 --json tagName --jq '.[].tagName'
            gh api --paginate "repos/${GITHUB_REPOSITORY}/tags?per_page=100" --jq '.[].name'
          )
          TAG="v$((LATEST + 1))"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG"

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: rbw-bot
          path: release-assets

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release-assets/rbw-bot.zip
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          body: |
            ## RankedBedwars ${{ steps.tag.outputs.tag }}

            ### Changes
            - See commit history for details

            ### Installation
            1. Bot: download `rbw-bot.zip`, extract, run `npm ci`, copy `.env.example` to `.env` and fill it in, then `npm start`
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
