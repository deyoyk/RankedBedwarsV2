name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bot-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Install dependencies
        working-directory: bot
        run: npm ci

      - name: Typecheck
        working-directory: bot
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: bot
        run: npm test

      - name: Lint
        working-directory: bot
        run: npm run lint

      - name: Build
        working-directory: bot
        run: npm run build

      - name: Package bot
        run: |
          cd bot
          zip -r ../rankedbedwars-bot.zip . -x 'node_modules/*' '.env' '*.log'

      - name: Upload bot artifact
        uses: actions/upload-artifact@v4
        with:
          name: rankedbedwars-bot
          path: rankedbedwars-bot.zip
          retention-days: 30

  web-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit

      - name: Build static export
        working-directory: web
        run: npm run build

      - name: Package web
        run: |
          cd web
          zip -r ../rbw-web.zip . -x 'node_modules/*' '.env*' '*.log'

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: rbw-web
          path: rbw-web.zip
          retention-days: 30

  build:
    needs: [bot-tests, web-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
      
      - name: Build and test with Maven
        working-directory: plugin
        run: mvn clean package
      
      - name: Get version from pom.xml
        id: version
        working-directory: plugin
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Built version: $VERSION"
      
      - name: Get tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" == "push" ] && [ "${{ github.ref_type }}" == "tag" ]; then
            TAG=${GITHUB_REF#refs/tags/}
          else
            TAG="v${{ steps.version.outputs.version }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG"
      
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: RankedBedwars-${{ steps.version.outputs.version }}.jar
          path: plugin/target/RankedBedwars-*.jar
          retention-days: 30

      - name: Download bot and web packages
        uses: actions/download-artifact@v4
        with:
          pattern: '{rankedbedwars-bot,rbw-web}'
          path: release-assets

      - name: Delete previous rolling release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: gh release delete "v${{ steps.version.outputs.version }}" --yes --cleanup-tag || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create Release
        if: (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            plugin/target/RankedBedwars-*.jar
            release-assets/rankedbedwars-bot/rankedbedwars-bot.zip
            release-assets/rbw-web/rbw-web.zip
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          body: |
            ## RankedBedwars ${{ steps.version.outputs.version }}
            
            ### Changes
            - See commit history for details
            
            ### Installation
            1. Plugin: download the JAR from the assets below, place it in your server's `plugins` folder, restart your server
            2. Bot: download `rankedbedwars-bot.zip`, extract, run `npm ci`, copy `.env.example` to `.env` and fill it in, then `npm start`
            3. Web: download `rbw-web.zip`, extract, run `npm ci && npm run build`
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
