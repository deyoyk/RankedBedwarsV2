name: Deploy bot to SFTP

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to deploy (leave blank for the latest published release)'
        required: false
        default: ''
        type: string
      remote_dir:
        description: 'Remote directory (default /home/container; chrooted SFTP is mapped automatically)'
        required: true
        default: '/home/container'
        type: string
      port:
        description: 'SFTP port (ignored when SFTP_HOST already contains a port)'
        required: true
        default: '22'
        type: string

concurrency:
  group: deploy-bot-sftp
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Upload and extract bot files
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Validate inputs
        env:
          REMOTE_DIR: ${{ inputs.remote_dir }}
          PORT: ${{ inputs.port }}
        run: |
          set -euo pipefail
          if [[ ! "$REMOTE_DIR" =~ ^/[A-Za-z0-9._/-]+$ ]] || [[ "$REMOTE_DIR" == *..* ]]; then
            echo "remote_dir must be an absolute path without '..' or shell metacharacters" >&2
            exit 1
          fi
          if [[ ! "$PORT" =~ ^[0-9]+$ ]] || (( PORT < 1 || PORT > 65535 )); then
            echo "port must be a number between 1 and 65535" >&2
            exit 1
          fi

      - name: Download latest published bot zip
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p deploy
          if [[ -n "${RELEASE_TAG// /}" ]]; then
            TAG="$RELEASE_TAG"
          else
            TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          fi
          echo "Deploying release: $TAG"
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "rbw-bot.zip" \
            --dir deploy \
            --clobber
          test -s deploy/rbw-bot.zip
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify and extract archive
        run: |
          set -euo pipefail
          unzip -l deploy/rbw-bot.zip | head -40
          unzip -l deploy/rbw-bot.zip | grep -qE ' package\.json$'
          mkdir -p deploy/payload
          unzip -oq deploy/rbw-bot.zip -d deploy/payload
          test -f deploy/payload/package.json

      - name: Install SFTP client
        run: python3 -m pip install --quiet paramiko==3.5.1

      - name: Clear remote directory and upload files
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST || vars.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME || vars.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD || vars.SFTP_PASSWORD }}
          REMOTE_DIR: ${{ inputs.remote_dir }}
          PORT: ${{ inputs.port }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          python3 - <<'PY'
          import os
          import posixpath
          import socket
          import stat
          import sys
          from urllib.parse import urlparse

          import paramiko

          raw_host = (os.environ.get("SFTP_HOST") or "").strip()
          username = os.environ.get("SFTP_USERNAME") or ""
          password = os.environ.get("SFTP_PASSWORD") or ""
          remote_dir = (os.environ.get("REMOTE_DIR") or "/").rstrip("/") or "/"
          port = int(os.environ.get("PORT") or "22")
          payload = os.path.abspath("deploy/payload")

          if raw_host.startswith("sftp://") or raw_host.startswith("ssh://"):
              parsed = urlparse(raw_host)
              host = parsed.hostname or ""
              if parsed.port:
                  port = parsed.port
          else:
              host = raw_host.rstrip("/")
              if host.count(":") == 1:
                  maybe_host, maybe_port = host.rsplit(":", 1)
                  if maybe_port.isdigit():
                      host = maybe_host
                      port = int(maybe_port)

          if not host or not username or not password:
              print("Missing SFTP_HOST, SFTP_USERNAME, or SFTP_PASSWORD", file=sys.stderr)
              sys.exit(1)
          if not os.path.isdir(payload):
              print(f"Missing extracted payload: {payload}", file=sys.stderr)
              sys.exit(1)

          candidate_ports = [port]
          if port == 22:
              candidate_ports.append(2022)

          transport = None
          last_error = None
          for candidate in candidate_ports:
              print(f"Connecting to {host}:{candidate} as {username}...", flush=True)
              sock = None
              try:
                  sock = socket.create_connection((host, candidate), timeout=30)
                  candidate_transport = paramiko.Transport(sock)
                  candidate_transport.banner_timeout = 30
                  candidate_transport.auth_timeout = 30
                  candidate_transport.channel_timeout = 30
                  candidate_transport.connect(username=username, password=password)
                  transport = candidate_transport
                  port = candidate
                  print(f"Connected on port {candidate}.", flush=True)
                  break
              except Exception as error:
                  last_error = error
                  print(f"Connection on port {candidate} failed: {error}", file=sys.stderr, flush=True)
                  try:
                      if sock is not None:
                          sock.close()
                  except Exception:
                      pass
          if transport is None:
              print(f"Could not connect to SFTP: {last_error}", file=sys.stderr)
              sys.exit(1)

          sftp = paramiko.SFTPClient.from_transport(transport)
          sftp.get_channel().settimeout(60)
          try:
              def normalize_remote(requested):
                  value = "/" + requested.strip("/") if requested.strip("/") else "/"
                  sftp_home = sftp.normalize(".")
                  root_names = {entry.filename for entry in sftp.listdir_attr("/")}
                  markers = {".env", "package.json", "pterodactyl-start.sh", "src", "dist"}
                  chrooted = sftp_home in ("/", ".") or bool(root_names & markers)
                  if chrooted and (value == "/home/container" or value.startswith("/home/container/")):
                      mapped = value[len("/home/container"):] or "/"
                      print(f"SFTP root is chrooted; mapping {value} -> {mapped}", flush=True)
                      return mapped
                  return value

              remote_dir = normalize_remote(remote_dir)
              print(f"SFTP home: {sftp.normalize('.')}; deploying to: {remote_dir}", flush=True)

              def ensure_dir(path):
                  current = ""
                  for part in path.strip("/").split("/"):
                      if not part:
                          continue
                      current += "/" + part
                      try:
                          sftp.stat(current)
                      except IOError:
                          sftp.mkdir(current)

              def remove_path(path, entry):
                  if stat.S_ISDIR(entry.st_mode):
                      for child in sftp.listdir_attr(path):
                          remove_path(posixpath.join(path, child.filename), child)
                      sftp.rmdir(path)
                  else:
                      sftp.remove(path)

              ensure_dir(remote_dir)
              existing = sftp.listdir_attr(remote_dir)
              if remote_dir == "/" and existing:
                  names = {entry.filename for entry in existing}
                  markers = {".env", "package.json", "pterodactyl-start.sh", "src", "dist"}
                  if not (names & markers):
                      print("Refusing to clear the SFTP root: expected .env/package.json/src/dist", file=sys.stderr)
                      sys.exit(1)
              for entry in existing:
                  if entry.filename == ".env":
                      continue
                  remove_path(posixpath.join(remote_dir, entry.filename), entry)

              uploaded = 0
              for root, dirs, files in os.walk(payload):
                  relative = os.path.relpath(root, payload)
                  remote_root = remote_dir if relative == "." else posixpath.join(remote_dir, relative.replace(os.sep, "/"))
                  ensure_dir(remote_root)
                  for directory in dirs:
                      ensure_dir(posixpath.join(remote_root, directory))
                  for filename in files:
                      local_path = os.path.join(root, filename)
                      remote_path = posixpath.join(remote_root, filename)
                      sftp.put(local_path, remote_path, confirm=False)
                      uploaded += 1
                      if uploaded % 50 == 0:
                          print(f"Uploaded {uploaded} files...", flush=True)
                      if filename.endswith(".sh"):
                          try:
                              sftp.chmod(remote_path, 0o755)
                          except IOError:
                              pass
              print(f"Uploaded {uploaded} files from {os.environ.get('TAG', 'release')} to {username}@{host}:{remote_dir}")
              print(f"Preserved: {posixpath.join(remote_dir, '.env')}")
          finally:
              sftp.close()
              transport.close()
          PY

          {
            echo "### Bot deployment"
            echo ""
            echo "- Release: \`$TAG\`"
            echo "- Server: \`$SFTP_HOST\`"
            echo "- Directory: \`$REMOTE_DIR\`"
            echo "- Preserved: \`.env\`"
          } >> "$GITHUB_STEP_SUMMARY"
