bot_url: "127.0.0.1:25565"
auth_key: "change_me_in_production"

api:
  host: "websocket.deyo.lol"
  port: 25506

# enabled: whether data storage is enabled or not (tho the game data will be saved from discord bot in mongodb this storage can be used for debugging purposes)

data-storage:
  enabled: true
  folder-path: "games" 


debug: false

# Automatically checks GitHub for a newer plugin jar on startup.
# The new jar is downloaded, SHA-256 verified, and swapped in after the
# server stops, so the next restart runs it.
auto-update:
  enabled: true
  github-repo: "deyoyk/RankedBedwarsV2"
  asset-name: "rbw-plugin.jar"
  api-base: "https://api.github.com"
  include-prereleases: false
  backup-current-jar: true
  # Set true only if you intentionally want to replace a newer local build
  # with the latest release.
  allow-downgrade: false
  # Optional for private repos or higher GitHub rate limits. If omitted,
  # RBW_GITHUB_TOKEN or GITHUB_TOKEN from the environment is used.
  github-token: ""
