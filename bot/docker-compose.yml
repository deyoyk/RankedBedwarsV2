services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "127.0.0.1:27017:27017"
  bot:
    build: .
    depends_on:
      - mongo
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017/deyorbw
    ports:
      - "25565:25565"
    restart: unless-stopped
volumes:
  mongo-data:
